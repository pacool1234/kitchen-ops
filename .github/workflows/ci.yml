name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for the migration check, deleted with the runner. Same major version as Render.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitchen_ops
          POSTGRES_PASSWORD: kitchen_ops
          POSTGRES_DB: kitchen_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen_ops -d kitchen_ops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot); the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so gitleaks can scan every commit

      # Fails if any tracked file matches .gitignore: client documents in the private eval folder,
      # .env files, node_modules, dist, coverage. Prints only a count, so file names never reach a public log.
      - name: No git-ignored files are tracked
        run: |
          count=$(git ls-files --cached --ignored --exclude-standard | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count tracked file(s) match .gitignore. Run 'git ls-files --cached --ignored --exclude-standard' locally and remove them from git."
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      # The S3 stand-in the storage tests run against (docker-compose.yml's `s3`, decision 0029).
      - name: Local S3 server
        run: docker compose up -d --wait s3
      - name: Test
        run: pnpm test
        env:
          # API tests create and migrate their own kitchen_ops_test database on the service container.
          TEST_DATABASE_URL: postgres://kitchen_ops:kitchen_ops@localhost:5432/kitchen_ops_test

      # Fails if the schema was changed without running db:generate and committing the migration.
      - name: Migrations match the schema
        run: |
          pnpm --filter @kitchen-ops/api db:generate
          if [ -n "$(git status --porcelain --untracked-files=all apps/api/drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'pnpm --filter @kitchen-ops/api db:generate' and commit apps/api/drizzle."
            git status --short apps/api/drizzle
            exit 1
          fi
      - name: Apply migrations to a throwaway database
        run: pnpm --filter @kitchen-ops/api db:migrate
        env:
          DATABASE_URL: postgres://kitchen_ops:kitchen_ops@localhost:5432/kitchen_ops
      - name: Seed
        # A fresh random secret per run: nothing secret-like is written in this file.
        run: BETTER_AUTH_SECRET="$(openssl rand -base64 32)" pnpm --filter @kitchen-ops/api db:seed
        env:
          DATABASE_URL: postgres://kitchen_ops:kitchen_ops@localhost:5432/kitchen_ops
          BETTER_AUTH_URL: http://localhost:3000

      # Starts the API the way Render does (`start`: Node with tsx, NODE_ENV=production) and waits for
      # /health to answer with this commit.
      - name: API starts in production mode
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)" pnpm --filter @kitchen-ops/api start &
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3000/health | grep -q "$GITHUB_SHA"; then
              echo "The API started and reports version $GITHUB_SHA."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The API did not answer /health with this commit within 30 seconds."
          exit 1
        env:
          NODE_ENV: production
          APP_VERSION: ${{ github.sha }}
          DATABASE_URL: postgres://kitchen_ops:kitchen_ops@localhost:5432/kitchen_ops
          BETTER_AUTH_URL: http://localhost:5173

      - name: Build
        run: pnpm build

      # Builds the backup image (ops/backup) and runs a full backup and restore against its own
      # throwaway database and a local stand-in for Scaleway (ops/backup/compose.test.yaml).
      - name: Backup and restore round trip
        run: bash ops/backup/test.sh

  # Browser tests (decision 0021): the built web app and the API against a database of their own,
  # at desktop and phone sizes, with axe on every page. A job of its own, so it runs alongside `ci`.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitchen_ops
          POSTGRES_PASSWORD: kitchen_ops
          POSTGRES_DB: kitchen_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen_ops -d kitchen_ops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser download (about 120 MB) is cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @kitchen-ops/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @kitchen-ops/web exec playwright install --with-deps chromium
      - name: Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @kitchen-ops/web exec playwright install-deps chromium

      # Where the browser tests' API keeps documents' files (docker-compose.yml's `s3`, #106).
      - name: Local S3 server
        run: docker compose up -d --wait s3

      - name: Browser tests
        run: pnpm --filter @kitchen-ops/web e2e
        env:
          E2E_DATABASE_URL: postgres://kitchen_ops:kitchen_ops@localhost:5432/kitchen_ops_e2e

      # Traces and screenshots of the failing tests: synthetic data only.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
