name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot); the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so gitleaks can scan every commit

      # Fails if any tracked file matches .gitignore: client documents in the private eval folder,
      # .env files, node_modules, dist, coverage. Prints only a count, so file names never reach a public log.
      - name: No git-ignored files are tracked
        run: |
          count=$(git ls-files --cached --ignored --exclude-standard | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count tracked file(s) match .gitignore. Run 'git ls-files --cached --ignored --exclude-standard' locally and remove them from git."
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
