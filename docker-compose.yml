# Local Postgres, and a stand-in for Scaleway's object storage, for development and the API's
# tests. Start with `docker compose up -d`; see README "Database".
# Same major version as CI and Render (18; product IDs use its built-in uuidv7()).
services:
  db:
    image: postgres:18-alpine
    environment:
      # Local-only credentials, not secrets. Real ones live in Render's environment.
      POSTGRES_USER: kitchen_ops
      POSTGRES_PASSWORD: kitchen_ops
      POSTGRES_DB: kitchen_ops
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_ops -d kitchen_ops"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Stands in for Scaleway Object Storage (decision 0029): an S3-compatible server that keeps each
  # bucket as a folder, as ops/backup's test does. The keys are local-only, not secrets.
  s3:
    image: rclone/rclone:1.71.2
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /data/kitchen-ops-documents && exec rclone serve s3 --addr :9000 --auth-key local-only-key,local-only-secret /data
    ports:
      - "127.0.0.1:9000:9000" # reachable from this machine only
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 1s
      timeout: 5s
      retries: 15

  # The backup image (ops/backup), for restore drills: docs/runbooks/restore.md. In the "tools"
  # profile, so `docker compose up` doesn't start it; `docker compose run --rm restore ...` does.
  restore:
    profiles: [tools]
    build: ops/backup
    entrypoint: ["restore.sh"]
    environment:
      PGHOST: db
      PGUSER: kitchen_ops
      PGPASSWORD: kitchen_ops
    volumes:
      # The downloaded dump and the key file. Git-ignored; empty it after the drill.
      - ./.restore-drill:/drill:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  s3-data:
