# Render Blueprint: staging and production, everything in Frankfurt (EU).
# Reference: https://render.com/docs/blueprint-spec
#
# Account setup, secrets and the first sync are done by hand by the repo owner (see README,
# "Deploying"). Nothing secret is written here: BETTER_AUTH_SECRET is generated by Render, and
# DATABASE_URL is read from the database.
#
# The service names become the public addresses (<name>.onrender.com). If Render had to add a
# suffix because a name was taken, update the URLs below (BETTER_AUTH_URL and the /api rewrite).
#
# Staging and production differ only where noted:
# - staging deploys every commit on main once CI passes; production deploys only from a release
#   tag (.github/workflows/deploy-production.yml), so its automatic deploys are off;
# - the staging API is on the free plan (sleeps when idle, no pre-deploy command), so it applies
#   migrations when it starts; production applies them as a pre-deploy command.

projects:
  - name: kitchen-ops
    environments:
      - name: staging
        services:
          - name: kitchen-ops-web-staging
            type: web
            runtime: static
            autoDeployTrigger: checksPass
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --filter "@kitchen-ops/web..." && pnpm --filter @kitchen-ops/web build
            staticPublishPath: apps/web/dist
            # The browser only talks to this site; /api/* is forwarded to the API, as Vite does
            # locally. Rules apply only where no file exists, so the built files are served as is.
            routes:
              - type: rewrite
                source: /api/*
                destination: https://kitchen-ops-api-staging.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            # Never cache the page or the service worker, so a new deploy reaches phones.
            headers:
              - path: /index.html
                name: Cache-Control
                value: no-cache
              - path: /sw.js
                name: Cache-Control
                value: no-cache

          - name: kitchen-ops-api-staging
            type: web
            runtime: node
            plan: free
            region: frankfurt
            autoDeployTrigger: checksPass
            # Production dependencies of the API and its workspace packages only.
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --prod --filter "@kitchen-ops/api..."
            # Free plan: no pre-deploy command, so migrate first. `exec` hands the shell's process
            # to Node, so Render's SIGTERM reaches the graceful shutdown in server.ts.
            startCommand: pnpm --filter @kitchen-ops/api db:migrate && cd apps/api && APP_VERSION="$RENDER_GIT_COMMIT" exec node --import tsx src/server.ts
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: LOG_LEVEL
                value: info
              - key: BETTER_AUTH_URL
                value: https://kitchen-ops-web-staging.onrender.com
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: kitchen-ops-db-staging
                  property: connectionString

        databases:
          - name: kitchen-ops-db-staging
            databaseName: kitchen_ops
            user: kitchen_ops
            plan: 0.1c-256mb
            region: frankfurt
            postgresMajorVersion: "18" # uuidv7() needs 18; cannot be changed after creation
            diskSizeGB: 1 # can grow later, never shrink
            ipAllowList: [] # no connections from the internet, only from services in the region

      - name: production
        permissions:
          protection: enabled
        services:
          - name: kitchen-ops-web
            type: web
            runtime: static
            autoDeployTrigger: "off"
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --filter "@kitchen-ops/web..." && pnpm --filter @kitchen-ops/web build
            staticPublishPath: apps/web/dist
            routes:
              - type: rewrite
                source: /api/*
                destination: https://kitchen-ops-api.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /index.html
                name: Cache-Control
                value: no-cache
              - path: /sw.js
                name: Cache-Control
                value: no-cache

          - name: kitchen-ops-api
            type: web
            runtime: node
            plan: 0.5c-512mb
            region: frankfurt
            autoDeployTrigger: "off"
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --prod --filter "@kitchen-ops/api..."
            # Runs once per deploy, before the new version starts. If it fails, the deploy stops
            # and the previous version keeps running.
            preDeployCommand: pnpm --filter @kitchen-ops/api db:migrate
            startCommand: cd apps/api && APP_VERSION="$RENDER_GIT_COMMIT" exec node --import tsx src/server.ts
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: LOG_LEVEL
                value: info
              - key: BETTER_AUTH_URL
                value: https://kitchen-ops-web.onrender.com
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: kitchen-ops-db
                  property: connectionString

        databases:
          - name: kitchen-ops-db
            databaseName: kitchen_ops
            user: kitchen_ops
            plan: 0.1c-256mb # paid: point-in-time recovery (3 days on the Hobby workspace)
            region: frankfurt
            postgresMajorVersion: "18"
            diskSizeGB: 1
            ipAllowList: []
