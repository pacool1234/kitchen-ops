# Render Blueprint: staging and production, everything in Frankfurt (EU).
# Reference: https://render.com/docs/blueprint-spec
#
# Account setup, secrets and the first sync are done by hand by the repo owner (see README,
# "Deploying"). Nothing secret is written here: BETTER_AUTH_SECRET is generated by Render, and
# DATABASE_URL is read from the database.
#
# The service names become the public addresses (<name>.onrender.com). If Render had to add a
# suffix because a name was taken, update the URLs below (BETTER_AUTH_URL and the /api rewrite).
#
# Staging and production differ only where noted:
# - staging deploys every commit on main once CI passes; production deploys only from a release
#   tag (.github/workflows/deploy-production.yml), so its automatic deploys are off;
# - the staging API is on the free plan (sleeps when idle, no pre-deploy command), so it applies
#   migrations when it starts; production applies them as a pre-deploy command.

projects:
  - name: kitchen-ops
    environments:
      - name: staging
        services:
          - name: kitchen-ops-web-staging
            type: web
            runtime: static
            autoDeployTrigger: checksPass
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --filter "@kitchen-ops/web..." && pnpm --filter @kitchen-ops/web build
            staticPublishPath: apps/web/dist
            # Read at build time and built into the app. Sentry (web project); the DSN is entered
            # in Render's dashboard.
            envVars:
              - key: VITE_SENTRY_DSN
                sync: false
              - key: VITE_SENTRY_ENVIRONMENT
                value: staging
            # The browser only talks to this site; /api/* is forwarded to the API, as Vite does
            # locally. Rules apply only where no file exists, so the built files are served as is.
            routes:
              - type: rewrite
                source: /api/*
                destination: https://kitchen-ops-api-staging.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            # Browsers and Render's CDN must check for a newer version before reusing anything,
            # so a deploy reaches phones at once. Without this rule, pages such as / and /products
            # are kept by the CDN for 5 minutes. Unchanged files are still answered with a short
            # 304, and the service worker keeps the app's files on the phone anyway.
            headers:
              - path: /*
                name: Cache-Control
                value: no-cache

          - name: kitchen-ops-api-staging
            type: web
            runtime: node
            plan: free
            region: frankfurt
            autoDeployTrigger: checksPass
            # Production dependencies of the API and its workspace packages only.
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --prod --filter "@kitchen-ops/api..."
            # Free plan: no pre-deploy command, so migrate first. `exec` hands the shell's process
            # to Node, so Render's SIGTERM reaches the graceful shutdown in server.ts.
            startCommand: pnpm --filter @kitchen-ops/api db:migrate && cd apps/api && APP_VERSION="$RENDER_GIT_COMMIT" exec node --import tsx --import ./src/instrument.ts src/server.ts
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: LOG_LEVEL
                value: info
              - key: BETTER_AUTH_URL
                value: https://kitchen-ops-web-staging.onrender.com
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: kitchen-ops-db-staging
                  property: connectionString
              # Sentry (API project). The DSN is entered in Render's dashboard.
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: staging

        databases:
          - name: kitchen-ops-db-staging
            databaseName: kitchen_ops
            user: kitchen_ops
            plan: 0.1c-256mb
            region: frankfurt
            postgresMajorVersion: "18" # uuidv7() needs 18; cannot be changed after creation
            diskSizeGB: 1 # can grow later, never shrink
            ipAllowList: [] # no connections from the internet, only from services in the region

      - name: production
        permissions:
          protection: enabled
        services:
          - name: kitchen-ops-web
            type: web
            runtime: static
            autoDeployTrigger: "off"
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --filter "@kitchen-ops/web..." && pnpm --filter @kitchen-ops/web build
            staticPublishPath: apps/web/dist
            # Read at build time and built into the app. Sentry (web project); the DSN is entered
            # in Render's dashboard.
            envVars:
              - key: VITE_SENTRY_DSN
                sync: false
              - key: VITE_SENTRY_ENVIRONMENT
                value: production
            routes:
              - type: rewrite
                source: /api/*
                destination: https://kitchen-ops-api.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: Cache-Control
                value: no-cache

          - name: kitchen-ops-api
            type: web
            runtime: node
            plan: 0.5c-512mb
            region: frankfurt
            autoDeployTrigger: "off"
            buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --prod --filter "@kitchen-ops/api..."
            # Runs once per deploy, before the new version starts. If it fails, the deploy stops
            # and the previous version keeps running.
            preDeployCommand: pnpm --filter @kitchen-ops/api db:migrate
            startCommand: cd apps/api && APP_VERSION="$RENDER_GIT_COMMIT" exec node --import tsx --import ./src/instrument.ts src/server.ts
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: LOG_LEVEL
                value: info
              - key: BETTER_AUTH_URL
                value: https://kitchen-ops-web.onrender.com
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: kitchen-ops-db
                  property: connectionString
              # Sentry (API project). The DSN is entered in Render's dashboard.
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: production

          # Weekly encrypted dump of the production database to a Scaleway bucket: the copy outside
          # Render (ops/backup, docs/runbooks/restore.md). Render gives cron jobs no deploy hook, so
          # the release workflow can't update it: deploy it by hand when ops/backup changes.
          - name: kitchen-ops-db-backup
            type: cron
            runtime: docker
            plan: 0.5c-512mb
            region: frankfurt
            schedule: "0 3 * * 1" # Mondays 03:00 UTC; also in ops/backup/backup.sh (Sentry)
            autoDeployTrigger: "off"
            dockerfilePath: ./ops/backup/Dockerfile
            dockerContext: ./ops/backup
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: kitchen-ops-db
                  property: connectionString
              # The backup key's public half: it can encrypt, not decrypt. The private half is
              # only in the repo owner's password manager.
              - key: BACKUP_AGE_RECIPIENT
                value: age1e39cfpjxr0rx3am5g5adkkqw472dvrhqc2ar0nl4e78pn0m9g9jq0xh0fk
              # Scaleway Object Storage, Paris. The bucket has versioning on and a retention rule.
              - key: BACKUP_S3_BUCKET
                value: kitchen-ops-db-backups
              - key: AWS_ENDPOINT_URL
                value: https://s3.fr-par.scw.cloud
              - key: AWS_DEFAULT_REGION
                value: fr-par
              # A Scaleway key that can only upload (no read, no delete), entered in the dashboard.
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false
              # Sentry Crons check-ins, with the API project's DSN, entered in the dashboard.
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: production

        databases:
          - name: kitchen-ops-db
            databaseName: kitchen_ops
            user: kitchen_ops
            plan: 0.1c-256mb # paid: point-in-time recovery (3 days on the Hobby workspace)
            region: frankfurt
            postgresMajorVersion: "18"
            diskSizeGB: 1
            ipAllowList: []
